# .github/prclaw.yml
# PRClaw NemoClaw Policy Configuration
# This file controls how PRClaw behaves on this repository.
# Powered by NemoClaw — all agent actions are governed by this policy.

persona:
  focus:
    - correctness
    - tests
    - error_handling
  strictness: 0.8          # 0.0 (lenient) to 1.0 (strict)
  tone: constructive but direct

trust:
  auto_label: true          # Apply trust:high/medium/new/flagged labels
  high_threshold: 0.75      # Trust score >= this = "high"
  cache_hours: 24           # Re-compute trust after this many hours

risk:
  auto_label: true          # Apply risk:low/medium/high/critical labels
  escalate_on:              # File paths that increase risk score
    - auth/
    - authentication/
    - crypto/
    - security/
    - requirements.txt
    - package.json
    - package-lock.json
    - Pipfile
    - go.mod
    - Dockerfile
    - .github/workflows/
    - migrations/

demand:
  auto_label: true          # Apply demand:high/medium/low labels
  comment_threshold: 25     # reactions needed to trigger demand comment
  cluster_min_size: 3       # minimum issues to form a cluster
  cluster_interval_minutes: 15

# Actions the system is NEVER allowed to take, regardless of other settings.
# These cannot be overridden by any other configuration.
forbidden:
  - merge_pr
  - close_pr
  - close_issue
  - reject_contributor
  - post_without_ai_disclosure
  - use_identity_signals         # Trust scoring must be behavior-only
